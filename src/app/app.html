<div class="progress" aria-hidden="true"><span #bar></span></div>

<!-- Background: pattern layers cross-fade as you move between sections, and drift at different speeds as you scroll -->
<div class="bgfx" #bgfx aria-hidden="true">
  <div class="glow"></div>
  @for (p of patterns; track p) {
    <div class="layer" [attr.data-pat]="p" [class.on]="bg.pattern() === p"></div>
  }
</div>

<!-- Shapes at different depths: each scrolls at its own speed, sways and spins -->
<div class="decor" #decor aria-hidden="true">
  <svg class="d d--star" viewBox="0 0 100 100"><polygon points="50,4 61,36 96,38 68,58 78,92 50,72 22,92 32,58 4,38 39,36"/></svg>
  <svg class="d d--squiggle" viewBox="0 0 120 40"><path d="M4 20 Q 20 0 36 20 T 68 20 T 100 20 T 116 20"/></svg>
  <svg class="d d--plus" viewBox="0 0 60 60"><path d="M30 6 V54 M6 30 H54"/></svg>
  <svg class="d d--ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30"/></svg>
  <svg class="d d--tri" viewBox="0 0 80 80"><polygon points="40,8 74,70 6,70"/></svg>
  <svg class="d d--plus2" viewBox="0 0 60 60"><path d="M30 6 V54 M6 30 H54"/></svg>
  <svg class="d d--squiggle2" viewBox="0 0 120 40"><path d="M4 20 Q 20 0 36 20 T 68 20 T 100 20 T 116 20"/></svg>
  <svg class="d d--star2" viewBox="0 0 100 100"><polygon points="50,4 61,36 96,38 68,58 78,92 50,72 22,92 32,58 4,38 39,36"/></svg>
  <svg class="d d--ring2" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30"/></svg>
  <svg class="d d--bolt" viewBox="0 0 60 100"><polygon points="36,4 8,56 28,56 20,96 54,38 34,38"/></svg>
</div>

<header class="nav">
  <a class="nav__logo" routerLink="/">PlantQuiz.</a>
  <nav class="nav__links" aria-label="Main">
    <a routerLink="/plants" routerLinkActive="is-active">Plants</a>
  </nav>
  <a class="btn btn--small" routerLink="/quiz">Take the quiz</a>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="footer">
  <p>© 2026 PlantQuiz · built with Angular · plant data and photos from <a href="https://perenual.com" target="_blank" rel="noopener">Perenual</a> (licence shown under each photo)</p>
</footer>
