<a class="card" [routerLink]="['/plant', plant().id]" [queryParams]="{ n: plant().name }">
  <div class="portrait" [attr.data-tone]="tone()">
    @if (plant().image) {
      <img [src]="plant().image" [alt]="plant().name" loading="lazy" width="400" height="300">
    }
    @if (percent() !== null) {
      <span class="badge">{{ percent() }}% match</span>
    }
  </div>
  <h3>{{ plant().name }}</h3>
  <p class="latin">{{ plant().scientific }}</p>
  @if (meta()) {
    <p class="meta">{{ meta() }}</p>
  }
</a>
