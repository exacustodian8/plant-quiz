<a class="card" [routerLink]="['/plant', plant().id]">
  <div class="portrait" [attr.data-vibe]="plant().vibe">
    <img [src]="plant().image" [alt]="plant().name" loading="lazy" width="400" height="300">
    <span class="emoji" aria-hidden="true">{{ plant().emoji }}</span>
    @if (percent() !== null) {
      <span class="badge">{{ percent() }}% match</span>
    }
  </div>
  <h3>{{ plant().name }}</h3>
  <p class="latin">{{ plant().scientific }}</p>
  <p class="meta">
    {{ watering[plant().watering] }} · {{ plant().petFriendly ? 'Pet-safe' : 'Not pet-safe' }}
  </p>
</a>
